version: 2.1

orbs:
  docker: circleci/docker@2.2.0
  go: circleci/go@1.9.0

executors:
  golang-executor:
    docker:
      - image: cimg/go:1.21
    working_directory: ~/project

jobs:
  # Build and test the Go application
  build-and-test:
    executor: golang-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

      - run:
          name: Download dependencies
          command: |
            go mod download
            go mod verify

      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod

      - run:
          name: Run tests
          command: |
            mkdir -p /tmp/test-results
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
            go tool cover -html=coverage.out -o /tmp/test-results/coverage.html

      - run:
          name: Run go vet
          command: go vet ./...

      - run:
          name: Run go fmt check
          command: |
            if [ -n "$(gofmt -l .)" ]; then
              echo "The following files need formatting:"
              gofmt -l .
              exit 1
            fi

      - run:
          name: Build binary
          command: |
            go build -v -o newrelic_exporter .
            ./newrelic_exporter --help || true

      - store_test_results:
          path: /tmp/test-results

      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

      - store_artifacts:
          path: ./newrelic_exporter
          destination: binaries

      - persist_to_workspace:
          root: .
          paths:
            - newrelic_exporter

  # Build Docker image
  build-docker:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image
          command: |
            docker build -t mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} .
            docker tag mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} mrf/newrelic-exporter:latest

      - run:
          name: Save Docker image
          command: |
            mkdir -p /tmp/docker-images
            docker save -o /tmp/docker-images/newrelic-exporter.tar mrf/newrelic-exporter:latest

      - store_artifacts:
          path: /tmp/docker-images
          destination: docker-images

  # Push Docker image to Docker Hub (only on main/master or tags)
  push-docker:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image
          command: |
            docker build -t mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} .

      - run:
          name: Tag Docker image
          command: |
            # Tag with commit SHA
            docker tag mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} mrf/newrelic-exporter:${CIRCLE_SHA1:0:7}

            # Tag with 'latest' on main/master
            if [ "${CIRCLE_BRANCH}" = "main" ] || [ "${CIRCLE_BRANCH}" = "master" ]; then
              docker tag mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} mrf/newrelic-exporter:latest
            fi

            # Tag with version if it's a tag
            if [ -n "${CIRCLE_TAG}" ]; then
              VERSION=${CIRCLE_TAG#v}  # Remove 'v' prefix if present
              docker tag mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} mrf/newrelic-exporter:${VERSION}

              # Also tag major and major.minor versions
              MAJOR=$(echo $VERSION | cut -d. -f1)
              MINOR=$(echo $VERSION | cut -d. -f2)
              docker tag mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} mrf/newrelic-exporter:${MAJOR}
              docker tag mrf/newrelic-exporter:${CIRCLE_SHA1:0:7} mrf/newrelic-exporter:${MAJOR}.${MINOR}
            fi

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - run:
          name: Push Docker images
          command: |
            docker push mrf/newrelic-exporter:${CIRCLE_SHA1:0:7}

            if [ "${CIRCLE_BRANCH}" = "main" ] || [ "${CIRCLE_BRANCH}" = "master" ]; then
              docker push mrf/newrelic-exporter:latest
            fi

            if [ -n "${CIRCLE_TAG}" ]; then
              VERSION=${CIRCLE_TAG#v}
              docker push mrf/newrelic-exporter:${VERSION}

              MAJOR=$(echo $VERSION | cut -d. -f1)
              MINOR=$(echo $VERSION | cut -d. -f2)
              docker push mrf/newrelic-exporter:${MAJOR}
              docker push mrf/newrelic-exporter:${MAJOR}.${MINOR}
            fi

  # Create GitHub release (only on tags)
  create-release:
    executor: golang-executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y

      - run:
          name: Create GitHub Release
          command: |
            gh release create ${CIRCLE_TAG} \
              --title "Release ${CIRCLE_TAG}" \
              --notes "Automated release created by CircleCI" \
              ./newrelic_exporter

workflows:
  version: 2

  # Main workflow for branches
  build-test-deploy:
    jobs:
      - build-and-test:
          filters:
            tags:
              ignore: /.*/

      - build-docker:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
                - master
            tags:
              ignore: /.*/

      - push-docker:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
                - master
          context:
            - docker-hub

  # Workflow for tagged releases
  release:
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/

      - push-docker:
          requires:
            - build-and-test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
          context:
            - docker-hub

      - create-release:
          requires:
            - build-and-test
            - push-docker
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
